name: 功能建议
description: 建议已有平台、界面或任务功能改进
title: "[Feature] "
labels: ["enhancement", "status:needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        新平台请使用“新平台接入建议 / 共创认领”模板。

        如果想认领，请在 Issue 评论区回复“认领”。
  - type: checkboxes
    id: precheck
    attributes:
      label: 提交前确认（可选）
      options:
        - label: 我已经搜索过已有 Issue 和 PR。
        - label: 这不是新增平台建议。
  - type: textarea
    id: description
    attributes:
      label: 功能建议
      description: 请说明想解决什么问题，以及希望万能导怎么表现。
      placeholder: 例如：导出失败后，只重试失败的文档和资源。
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: 示例、参考资料或截图（可选）
      description: 可直接拖入截图，或粘贴公开链接和示例内容。
