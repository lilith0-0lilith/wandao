name: 新平台接入建议 / 共创认领
description: 建议万能导支持新的平台
title: "[Platform] "
labels: ["enhancement", "help wanted", "plugin", "status:needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        不需要会开发也可以提出建议。

        如果想认领，请在 Issue 评论区回复“认领”。请不要提交 Cookie、Token、账号密码、App Secret、API Key 或私人内容。
  - type: checkboxes
    id: precheck
    attributes:
      label: 提交前确认（可选）
      options:
        - label: 我已经搜索过已有 Issue 和 PR。
        - label: 没有提交敏感信息。
  - type: input
    id: platform
    attributes:
      label: 平台名称
      placeholder: 例如：飞书 / 语雀 / 某某知识库
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: 需求描述
      description: 请简单说明希望支持什么，以及平台需要怎样登录或操作。
      placeholder: 例如：希望支持导出 Markdown，网页内容需要登录后查看。
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: 官网、公开资料或测试材料（可选）
      description: 可直接拖入截图，或粘贴公开链接、脱敏样例和测试说明。
